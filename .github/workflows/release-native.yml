# The app (native/), released on its own, separately from the site:
# - bump native/VERSION on main and push: if there's no native-vX.Y.Z tag for
#   it yet, the tag job adds one and the release runs;
# - or push a tag like native-v0.2.0 yourself (it must match native/VERSION);
# - or press "Run workflow" on the Actions tab (on main it also adds a missing tag).
# A push to any other branch that touches native/ checks and builds it on all
# three platforms and releases nothing, so a broken build shows up before main.
# Nothing outside native/ starts this workflow, and nothing in native/ starts
# the site's (release-web.yml).
name: Release app

on:
  push:
    branches: ['**']
    tags: ['native-v*']
    paths: [native/**, .github/workflows/release-native.yml]
  workflow_dispatch:

# Releases queue behind each other; a branch's newer push replaces its older check.
concurrency:
  group: release-native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# Every action and image below is pinned to a commit or digest (the version
# it was is in the comment): a tag can be moved, and these build the binaries.

jobs:
  # Decides whether this run releases, tagging the version on main if it isn't yet.
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.tag.outputs.release }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: tag
        env:
          # The site the app opens, baked into it. The same variable the site's build uses.
          SITE_URL: ${{ vars.VITE_PUBLIC_URL }}
        run: |
          version=$(tr -d '[:space:]' < native/VERSION)
          tag="native-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match native/VERSION ($version)."
              exit 1
            fi
            release=true
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ -z "$SITE_URL" ]; then
              echo "::warning::The VITE_PUBLIC_URL variable isn't set, so the app wouldn't know which site to open. Not releasing (and not tagging)."
            elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag is already tagged."
              [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && release=true
            else
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git tag -a "$tag" -m "Pivoice app $version"
              git push origin "refs/tags/$tag"
              echo "Tagged $tag."
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/native/build/deps/lib/pkgconfig:${{ github.workspace }}/native/build/pkgconfig
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev portaudio19-dev cmake pkg-config xvfb
      # The system's PortAudio is fine for the tests; the processing libraries are built the release's way.
      - run: build/deps.sh rnnoise speexdsp
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Known vulnerabilities in Go or a module, in code the app can reach.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # The engine's tests run two engines on fake sound cards, talking over real WebRTC;
      # internal/webkit's open real WebKitGTK windows (hence the display).
      - run: xvfb-run -a go test -race ./...
      # What the mic's processing costs (the README's table comes from here).
      - name: Benchmarks
        run: |
          go test -run '^$' -bench . -benchtime 2s ./internal/dsp/ | tee bench.txt
          { echo '### Processing benchmarks'; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # In parallel with check: a release waits for both, so nothing ships unless the tests pass too.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu with WebKitGTK 4.1, so the binary runs on as many distros as it can (glibc 2.35+).
          - os: ubuntu-22.04
            platform: linux-amd64.tar.gz
          # macOS is switched off for now (its runners can queue for a long time).
          # Uncomment to bring it back: one universal binary, Apple silicon and Intel.
          # - os: macos-14
          #   platform: macos.tar.gz
          - os: windows-latest
            platform: windows-amd64.exe
    runs-on: ${{ matrix.os }}
    env:
      PIVOICE_URL: ${{ vars.VITE_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      # Each file is named for its version (src/native/downloads.ts links to them by name).
      - name: Name
        shell: bash
        run: echo "ASSET=pivoice-$(tr -d '[:space:]' < native/VERSION)-${{ matrix.platform }}" >> "$GITHUB_ENV"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev cmake pkg-config
          native/build/deps.sh
          STATIC_AUDIO=1 native/build.sh "$PWD/dist/pivoice"
          # PortAudio, RNNoise and SpeexDSP are in the binary; ALSA is loaded when it starts. (Its own
          # NEEDED entries only: ldd would list WebKitGTK's dependencies too.)
          readelf -d dist/pivoice | grep NEEDED
          if readelf -d dist/pivoice | grep NEEDED | grep -E 'portaudio|opus|asound|rnnoise|speex'; then echo "::error::linked against a shared audio library"; exit 1; fi
          tar -czf "$ASSET" -C dist pivoice

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        # One architecture at a time, then glued together.
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          for arch in arm64:arm64 x86_64:amd64; do
            CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=${arch%%:*} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0" DEPS_DIR="$PWD/deps-${arch#*:}" native/build/deps.sh
            GOARCH=${arch#*:} DEPS_DIR="$PWD/deps-${arch#*:}" STATIC_AUDIO=1 native/build.sh "$PWD/dist/pivoice-${arch#*:}"
          done
          lipo -create -output dist/pivoice dist/pivoice-arm64 dist/pivoice-amd64
          # Ad hoc: Apple silicon won't run an unsigned binary at all. (Not notarized: see the release notes.)
          codesign --force --sign - dist/pivoice
          lipo -info dist/pivoice
          if otool -L dist/pivoice | grep -E 'portaudio|opus|rnnoise|speex'; then echo "::error::linked against a shared audio library"; exit 1; fi
          tar -czf "$ASSET" -C dist pivoice

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          native/build/deps.sh
          STATIC_AUDIO=1 native/build.sh "$PWD/dist/pivoice.exe"
          if ldd dist/pivoice.exe | grep -iE 'portaudio|opus|rnnoise|speex|libstdc|libgcc|libwinpthread'; then echo "::error::needs a DLL that won't be there"; exit 1; fi
          cp dist/pivoice.exe "$ASSET"
      # The window's WebView2 policy (internal/wv2), on a real WebView2: the
      # only place it can run, since the check job is Linux.
      - name: Test the WebView2 policy (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: native
        run: go test -count=1 -v ./internal/wv2/

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          # Only the release job (minutes later) needs these; the release keeps its own copies.
          retention-days: 1

  # The Linux binary again, in a Flatpak: the GNOME runtime brings WebKitGTK, and the sandbox
  # gets the network, the sound server and the display but none of your files.
  flatpak:
    needs: [tag, build]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Stage
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < native/VERSION)
          tar -xzf "dist/pivoice-$version-linux-amd64.tar.gz" -C native/flatpak pivoice
          sed -i "s/@VERSION@/$version/; s/@DATE@/$(date -u +%F)/" native/flatpak/io.github.nicholas_sbx.Pivoice.metainfo.xml
          desktop-file-validate native/flatpak/io.github.nicholas_sbx.Pivoice.desktop
          appstreamcli validate --no-net native/flatpak/io.github.nicholas_sbx.Pivoice.metainfo.xml
          echo "FLATPAK=pivoice-$version-linux-x86_64.flatpak" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: ${{ env.FLATPAK }}
          manifest-path: native/flatpak/io.github.nicholas_sbx.Pivoice.yml
          cache: false
          upload-artifact: false
      # Building doesn't load the binary, so check here that every library it links is in the
      # runtime: install the bundle and have the loader list them inside the sandbox.
      - name: Check its libraries resolve
        shell: bash
        run: |
          flatpak install --user --noninteractive --assumeyes "$FLATPAK"
          libs=$(flatpak run --env=LD_TRACE_LOADED_OBJECTS=1 io.github.nicholas_sbx.Pivoice)
          echo "$libs"
          if grep -q 'not found' <<< "$libs"; then
            echo "::error::Libraries missing from the runtime:"; grep 'not found' <<< "$libs"; exit 1
          fi
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ env.FLATPAK }}
          path: ${{ env.FLATPAK }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [tag, check, build, flatpak]
    if: needs.tag.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed statement, from GitHub, of which workflow
      # run built each file (`gh attestation verify FILE --repo OWNER/REPO`).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          tag="native-v$VERSION"
          cat > notes.md <<EOF
          The Pivoice app $VERSION: the site, with the audio done natively (one duplex sound card callback, WebRTC from Go).
          It's one file; there's nothing to install.

          - **Linux** (x86-64): \`tar -xzf pivoice-$VERSION-linux-amd64.tar.gz && ./pivoice\`. Needs WebKitGTK 4.1 (\`libwebkit2gtk-4.1-0\` on Debian and Ubuntu, \`webkit2gtk4.1\` on Fedora), which most desktops already have. For the overlay on KDE, Sway or Hyprland, also gtk-layer-shell (\`libgtk-layer-shell0\` on Debian and Ubuntu, \`gtk-layer-shell\` on Fedora and Arch).
          - **Linux, Flatpak** (x86-64): \`flatpak install --user pivoice-$VERSION-linux-x86_64.flatpak\`, then \`flatpak run io.github.nicholas_sbx.Pivoice\`. Sandboxed: it gets the network, your sound card and the display, and none of your files. Its overlay is an ordinary window for now, which takes clicks: the runtime has no gtk-layer-shell.
          - **Windows** (10 and 11, x86-64): run \`pivoice-$VERSION-windows-amd64.exe\`. SmartScreen may warn first, since it isn't signed: More info → Run anyway. Uses the WebView2 runtime that comes with Windows.

          Pass an invite link or a room code to go straight to it: \`./pivoice https://…/#ABC234\`. \`--browser\` opens the UI in your browser instead of its own window.

          To check a download: \`sha256sum -c SHA256SUMS --ignore-missing\`, or that GitHub built it here: \`gh attestation verify FILE --repo $GITHUB_REPOSITORY\`.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A release that's out is never changed: only what's missing from it
            # (a run that failed partway) is added.
            have=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for f in dist/*; do
              if grep -qxF "$(basename "$f")" <<< "$have"; then
                echo "$(basename "$f") is already in $tag: leaving it."
              else
                gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "Pivoice app $VERSION" --notes-file notes.md
          fi
