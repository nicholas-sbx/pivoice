# The app: a Worker that serves the static build in dist/ and mints TURN
# credentials at /api/ice. Deployed by .github/workflows/release.yml.
name = "voice"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Static files are served without waking the Worker; only the API runs code.
run_worker_first = ["/api/*"]

# Optional TURN relay (Cloudflare Realtime → TURN). Set both as secrets, never here:
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN
# Without them /api/ice answers 404 and the app falls back to public STUN.

# Optional: cap how often one IP can ask for credentials.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 20, period = 60 }
