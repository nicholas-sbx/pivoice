# The app: static build in dist/ plus a Worker that runs the rooms
# (one Durable Object each) and mints TURN credentials at /api/ice.
# Deployed by .github/workflows/release.yml.
name = "voice"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Only the API runs the Worker. Static files are served straight from the
# assets, which Cloudflare doesn't count against the Worker request limits; the
# cross-origin isolation headers for them come from public/_headers.
run_worker_first = ["/api/*"]

# The rooms. SQLite-backed, which is what the Workers Free plan allows.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Optional TURN relay (Cloudflare Realtime → TURN). Set both as secrets, never here:
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN
# Without them /api/ice answers 404 and the app uses public STUN only.

# Optional: cap how often one IP can ask for TURN credentials.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 20, period = 60 }

# Optional: cap how often one IP can make or connect to rooms, which makes
# guessing room codes slow. Generous, since a whole LAN party shares an IP.
# [[ratelimits]]
# name = "ROOM_LIMITER"
# namespace_id = "1002"
# simple = { limit = 60, period = 60 }
